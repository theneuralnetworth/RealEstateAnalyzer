services:
  webapi:
    build:
      context: ./real-estate-pprogia-webapi/RealEstateAPI
    ports:
      - 8080:80
    environment:
      PROLOG_URL: http://prolog:8000
    networks:
      - real-estate-analyzer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 5s
      timeout: 10s
      retries: 5

  prolog:
    build:
      context: ./real-estate-analyzer-expert-system
    stop_grace_period: 1s
    ports:
      - 8081:8000
    networks:
      - real-estate-analyzer

  web:
    build:
      context: ./real-estate-web
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 10s
      retries: 5

  drools:
    build:
      context: ./real-estate-analyzer
    ports:
      - "8082:8080"
    volumes:
      - ./locations.json:/knowledgebase/locations.json:ro
      - ./properties.json:/knowledgebase/properties.json:ro
    environment:
      KNOWLEDGE_BASE_LOCATIONS_FILE: /knowledgebase/locations.json
      KNOWLEDGE_BASE_PROPERTIES_FILE: /knowledgebase/properties.json

networks:
  real-estate-analyzer:
