name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-drools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Drools image
        uses: docker/build-push-action@v5
        with:
          context: real-estate-analyzer
          push: false
          tags: drools:latest
  build-prolog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Prolog image
        uses: docker/build-push-action@v5
        with:
          context: real-estate-analyzer-expert-system
          push: false
          tags: prolog:latest
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: real-estate-web
          push: false
          tags: web:latest
  build-webapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build WebAPI image
        uses: docker/build-push-action@v5
        with:
          context: real-estate-pprogia-webapi/RealEstateAPI
          push: false
          tags: webapi:latest
